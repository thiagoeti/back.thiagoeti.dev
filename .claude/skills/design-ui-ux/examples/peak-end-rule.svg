<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-labelledby="t">
<title id="t">Regra do Pico-Fim: antes, susto e fim seco; depois, fim que encerra bem</title>
<rect x="2" y="2" width="154" height="156" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/><text x="10" y="18" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">✕ ANTES</text><text x="10" y="31" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">susto e fim seco</text><line x1="10" y1="36" x2="148" y2="36" stroke="#1F2937" stroke-width="1" stroke-linecap="round"/><rect x="10" y="40" width="138" height="26" rx="4" fill="#030712" stroke="#F87171" stroke-width="1"/><text x="18" y="57" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Erro 500</text><text x="10" y="96" fill="#F3F4F6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Pedido recebido.</text><rect x="164" y="2" width="154" height="156" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/><text x="172" y="18" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">✓ DEPOIS</text><text x="172" y="31" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">fim que encerra bem</text><line x1="172" y1="36" x2="310" y2="36" stroke="#1F2937" stroke-width="1" stroke-linecap="round"/><text x="172" y="56" fill="#34D399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">✓ Pedido confirmado</text><text x="172" y="74" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Chega em 5 dias</text><text x="172" y="90" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Pix aprovado</text><rect x="172" y="104" width="138" height="24" rx="4" fill="#34D399"/><text x="241.0" y="119.5" fill="#030712" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">Acompanhar pedido</text>
</svg>
